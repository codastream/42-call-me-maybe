[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.3",
    "rich>=15.0.0",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "autopep8>=2.3.2",
    "flake8>=7.3.0",
    "mypy>=1.20.2",
    "pydantic>=2.13.3",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
exclude = [
    '^\.venv/',
    '^venv/',
    '^build/',
    '^dist/',
    '^llm_sdk/'
]
plugins = [
    "pydantic.mypy"
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
indent-style = "space"
indent-width = 2

[tool.ruff.lint]
select = ["D"] # pydocstyle

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }
